<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 676" width="680" height="676" font-family="Helvetica Neue, Arial, sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#475569"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#b91c1c"/></marker></defs>
<rect width="680" height="676" fill="#ffffff"/>
<text x="340" y="24" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="554.4" lengthAdjust="spacingAndGlyphs">Сценарий: удалить категорию и товар, занять название, восстановить</text>
<rect x="15" y="40" width="150" height="30" rx="6" fill="#e0f2fe" stroke="#0369a1"/>
<text x="90" y="60" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="87.4" lengthAdjust="spacingAndGlyphs">Администратор</text>
<line x1="90" y1="70" x2="90" y2="636" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<rect x="265" y="40" width="150" height="30" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
<text x="340" y="60" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="67.2" lengthAdjust="spacingAndGlyphs">Экран (§8)</text>
<line x1="340" y1="70" x2="340" y2="636" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<rect x="515" y="40" width="150" height="30" rx="6" fill="#dcfce7" stroke="#15803d"/>
<text x="590" y="60" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="53.8" lengthAdjust="spacingAndGlyphs">API (§6)</text>
<line x1="590" y1="70" x2="590" y2="636" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<line x1="90" y1="100" x2="340" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="94" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="263.2" lengthAdjust="spacingAndGlyphs">«Удалить» у категории «Фильтры» (§8.1), причина</text>
<line x1="340" y1="128" x2="590" y2="128" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="465.0" y="122" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="302.4" lengthAdjust="spacingAndGlyphs">DELETE /api/v1/catalog-categories/{id} {reason} (§6.5)</text>
<text x="465.0" y="141" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="normal" textLength="202.2" lengthAdjust="spacingAndGlyphs">товары категории остаются действующими</text>
<line x1="590" y1="168" x2="340" y2="168" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="465.0" y="162" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="112.0" lengthAdjust="spacingAndGlyphs">200 {id, deleted_at}</text>
<line x1="90" y1="196" x2="340" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="190" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="184.8" lengthAdjust="spacingAndGlyphs">создаёт новую категорию «Фильтры»</text>
<line x1="340" y1="224" x2="590" y2="224" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="465.0" y="218" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="212.8" lengthAdjust="spacingAndGlyphs">POST /api/v1/catalog-categories (§6.9)</text>
<text x="465.0" y="237" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="normal" textLength="180.9" lengthAdjust="spacingAndGlyphs">название удалённой записи свободно</text>
<line x1="590" y1="264" x2="340" y2="264" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="465.0" y="258" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="72.8" lengthAdjust="spacingAndGlyphs">200 — создана</text>
<line x1="90" y1="292" x2="340" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="286" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="274.4" lengthAdjust="spacingAndGlyphs">«Удалённые» → «Категории» → «Восстановить» (§8.2)</text>
<rect x="20" y="302" width="640" height="78" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-dasharray="5 4"/>
<text x="28" y="316" font-size="10" fill="#7f1d1d" text-anchor="start" font-weight="bold" textLength="257.6" lengthAdjust="spacingAndGlyphs">ошибка: название занято действующей категорией</text>
<line x1="340" y1="338" x2="590" y2="338" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#r)"/>
<text x="465.0" y="332" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="285.6" lengthAdjust="spacingAndGlyphs">POST /api/v1/catalog-categories/{id}/restore (§6.6)</text>
<line x1="590" y1="366" x2="340" y2="366" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text x="465.0" y="360" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="78.4" lengthAdjust="spacingAndGlyphs">409 NAME_TAKEN</text>
<line x1="90" y1="418" x2="340" y2="418" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="412" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="252.0" lengthAdjust="spacingAndGlyphs">«Удалить» у товара с остатком (§8.1), причина</text>
<rect x="20" y="428" width="640" height="78" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-dasharray="5 4"/>
<text x="28" y="442" font-size="10" fill="#7f1d1d" text-anchor="start" font-weight="bold" textLength="162.4" lengthAdjust="spacingAndGlyphs">ошибка: у товара есть остаток</text>
<line x1="340" y1="464" x2="590" y2="464" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#r)"/>
<text x="465.0" y="458" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="246.4" lengthAdjust="spacingAndGlyphs">DELETE /api/v1/products/{id} {reason} (§6.1)</text>
<line x1="590" y1="492" x2="340" y2="492" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text x="465.0" y="486" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="117.6" lengthAdjust="spacingAndGlyphs">409 PRODUCT_HAS_STOCK</text>
<line x1="90" y1="534" x2="340" y2="534" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="528" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="179.2" lengthAdjust="spacingAndGlyphs">списывает остаток, удаляет снова</text>
<line x1="340" y1="562" x2="590" y2="562" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="465.0" y="556" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="246.4" lengthAdjust="spacingAndGlyphs">DELETE /api/v1/products/{id} {reason} (§6.1)</text>
<line x1="590" y1="590" x2="340" y2="590" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="465.0" y="584" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="112.0" lengthAdjust="spacingAndGlyphs">200 {id, deleted_at}</text>
<line x1="340" y1="618" x2="90" y2="618" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="215.0" y="612" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="201.6" lengthAdjust="spacingAndGlyphs">в заказах товар — с бейджем «удалён»</text>
<text x="20" y="664" font-size="10" fill="#334155" text-anchor="start" font-weight="normal" textLength="408.8" lengthAdjust="spacingAndGlyphs">Сплошная стрелка — запрос, пунктир — ответ, красная рамка — ветка ошибки.</text>
</svg>