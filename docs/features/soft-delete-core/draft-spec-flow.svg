<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" font-family="Helvetica Neue, Arial, sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#475569"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#b91c1c"/></marker></defs>
<rect width="680" height="640" fill="#ffffff"/>
<text x="340" y="24" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="445.2" lengthAdjust="spacingAndGlyphs">Сценарий: удалить заказ с причиной и восстановить его</text>
<rect x="15" y="40" width="150" height="30" rx="6" fill="#e0f2fe" stroke="#0369a1"/>
<text x="90" y="60" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="87.4" lengthAdjust="spacingAndGlyphs">Администратор</text>
<line x1="90" y1="70" x2="90" y2="590" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<rect x="265" y="40" width="150" height="30" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
<text x="340" y="60" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="67.2" lengthAdjust="spacingAndGlyphs">Экран (§8)</text>
<line x1="340" y1="70" x2="340" y2="590" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<rect x="515" y="40" width="150" height="30" rx="6" fill="#dcfce7" stroke="#15803d"/>
<text x="590" y="60" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="53.8" lengthAdjust="spacingAndGlyphs">API (§6)</text>
<line x1="590" y1="70" x2="590" y2="590" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<line x1="90" y1="100" x2="340" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="94" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="184.8" lengthAdjust="spacingAndGlyphs">«Удалить заказ» в карточке (§8.3)</text>
<line x1="340" y1="128" x2="90" y2="128" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="215.0" y="122" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="184.8" lengthAdjust="spacingAndGlyphs">окно «Удаление» с причиной (§8.2)</text>
<rect x="20" y="146" width="640" height="78" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-dasharray="5 4"/>
<text x="28" y="160" font-size="10" fill="#7f1d1d" text-anchor="start" font-weight="bold" textLength="123.2" lengthAdjust="spacingAndGlyphs">ошибка: причина пустая</text>
<line x1="340" y1="182" x2="590" y2="182" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#r)"/>
<text x="465.0" y="176" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="207.2" lengthAdjust="spacingAndGlyphs">DELETE /api/v1/tasks/128 {reason: ""}</text>
<line x1="590" y1="210" x2="340" y2="210" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text x="465.0" y="204" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="173.6" lengthAdjust="spacingAndGlyphs">400 VALIDATION reason: required</text>
<line x1="90" y1="254" x2="340" y2="254" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="248" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="140.0" lengthAdjust="spacingAndGlyphs">вводит причину, «Удалить»</text>
<line x1="340" y1="282" x2="590" y2="282" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="465.0" y="276" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="224.0" lengthAdjust="spacingAndGlyphs">DELETE /api/v1/tasks/128 {reason} (§6.1)</text>
<text x="465.0" y="295" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="normal" textLength="138.3" lengthAdjust="spacingAndGlyphs">товары возвращены на склад</text>
<line x1="590" y1="322" x2="340" y2="322" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="465.0" y="316" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="168.0" lengthAdjust="spacingAndGlyphs">200 {id, deleted_at, warnings}</text>
<line x1="340" y1="350" x2="90" y2="350" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="215.0" y="344" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="207.2" lengthAdjust="spacingAndGlyphs">карточка закрыта, заказа нет на доске</text>
<line x1="90" y1="390" x2="340" y2="390" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="384" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="128.8" lengthAdjust="spacingAndGlyphs">меню «Удалённые» (§8.1)</text>
<line x1="340" y1="418" x2="590" y2="418" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="465.0" y="412" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="196.0" lengthAdjust="spacingAndGlyphs">GET /api/v1/deleted/summary (§6.24)</text>
<line x1="340" y1="446" x2="590" y2="446" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="465.0" y="440" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="212.8" lengthAdjust="spacingAndGlyphs">GET /api/v1/deleted?kind=tasks (§6.23)</text>
<line x1="590" y1="474" x2="340" y2="474" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="465.0" y="468" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="184.8" lengthAdjust="spacingAndGlyphs">200 {items, total, limit, offset}</text>
<line x1="90" y1="506" x2="340" y2="506" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="500" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="168.0" lengthAdjust="spacingAndGlyphs">«Восстановить» в строке заказа</text>
<line x1="340" y1="534" x2="590" y2="534" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="465.0" y="528" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="207.2" lengthAdjust="spacingAndGlyphs">POST /api/v1/tasks/128/restore (§6.2)</text>
<text x="465.0" y="547" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="normal" textLength="106.4" lengthAdjust="spacingAndGlyphs">товары списаны снова</text>
<line x1="590" y1="574" x2="340" y2="574" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="465.0" y="568" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="151.2" lengthAdjust="spacingAndGlyphs">200 {id, warnings, notices}</text>
<line x1="340" y1="602" x2="90" y2="602" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="215.0" y="596" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="235.2" lengthAdjust="spacingAndGlyphs">строка исчезла; жёлтый блок предупреждений</text>
<text x="20" y="628" font-size="10" fill="#334155" text-anchor="start" font-weight="normal" textLength="408.8" lengthAdjust="spacingAndGlyphs">Сплошная стрелка — запрос, пунктир — ответ, красная рамка — ветка ошибки.</text>
</svg>