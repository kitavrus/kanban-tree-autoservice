<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="Helvetica Neue, Arial, sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#475569"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#b91c1c"/></marker></defs>
<rect width="680" height="430" fill="#ffffff"/>
<text x="340" y="26" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="403.2" lengthAdjust="spacingAndGlyphs">Состояния записи: действует / в архиве / удалена</text>
<circle cx="60" cy="110" r="7" fill="#0f172a"/>
<line x1="67" y1="110" x2="118" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="92" y="100" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" textLength="44.8" lengthAdjust="spacingAndGlyphs">создание</text>
<rect x="120" y="70" width="190" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="215" y="96" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold" textLength="131.0" lengthAdjust="spacingAndGlyphs">Действует (active)</text>
<text x="215" y="116" font-size="10.5" fill="#14532d" text-anchor="middle" font-weight="normal" textLength="147.0" lengthAdjust="spacingAndGlyphs">можно: всё, что и сейчас;</text>
<text x="215" y="132" font-size="10.5" fill="#14532d" text-anchor="middle" font-weight="normal" textLength="117.6" lengthAdjust="spacingAndGlyphs">«В архив», «Удалить»</text>
<rect x="120" y="270" width="190" height="80" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<text x="215" y="296" font-size="13" fill="#713f12" text-anchor="middle" font-weight="bold" textLength="138.3" lengthAdjust="spacingAndGlyphs">В архиве (archived)</text>
<text x="215" y="316" font-size="10.5" fill="#713f12" text-anchor="middle" font-weight="normal" textLength="141.1" lengthAdjust="spacingAndGlyphs">можно: просмотр, правка,</text>
<text x="215" y="332" font-size="10.5" fill="#713f12" text-anchor="middle" font-weight="normal" textLength="117.6" lengthAdjust="spacingAndGlyphs">«Вернуть», «Удалить»</text>
<rect x="450" y="150" width="200" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="550" y="178" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="bold" textLength="123.8" lengthAdjust="spacingAndGlyphs">Удалена (deleted)</text>
<text x="550" y="198" font-size="10.5" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="158.8" lengthAdjust="spacingAndGlyphs">видна только в «Удалённых»;</text>
<text x="550" y="214" font-size="10.5" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="129.4" lengthAdjust="spacingAndGlyphs">можно: «Восстановить»;</text>
<text x="550" y="230" font-size="10.5" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="88.2" lengthAdjust="spacingAndGlyphs">остальное — 404</text>
<text x="550" y="248" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="117.6" lengthAdjust="spacingAndGlyphs">кто · когда · причина</text>
<line x1="185" y1="150" x2="185" y2="268" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="178" y="206" font-size="10" fill="#475569" text-anchor="end" font-weight="normal" textLength="50.4" lengthAdjust="spacingAndGlyphs">«В архив»</text>
<text x="178" y="220" font-size="10" fill="#475569" text-anchor="end" font-weight="normal" textLength="39.2" lengthAdjust="spacingAndGlyphs">(as-is)</text>
<line x1="245" y1="270" x2="245" y2="152" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="252" y="206" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" textLength="106.4" lengthAdjust="spacingAndGlyphs">«Вернуть из архива»</text>
<text x="252" y="220" font-size="10" fill="#475569" text-anchor="start" font-weight="normal" textLength="39.2" lengthAdjust="spacingAndGlyphs">(as-is)</text>
<path d="M310,95 C400,95 470,110 500,148" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="420" y="86" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" textLength="151.2" lengthAdjust="spacingAndGlyphs">«Удалить» + причина (admin)</text>
<path d="M450,185 C400,170 360,150 312,135" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="420" y="146" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" textLength="78.4" lengthAdjust="spacingAndGlyphs">«Восстановить»</text>
<path d="M310,325 C400,325 470,300 500,262" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="420" y="340" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" textLength="151.2" lengthAdjust="spacingAndGlyphs">«Удалить» + причина (admin)</text>
<path d="M450,225 C400,245 360,270 312,288" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="412" y="278" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" textLength="78.4" lengthAdjust="spacingAndGlyphs">«Восстановить»</text>
<text x="412" y="291" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="79.8" lengthAdjust="spacingAndGlyphs">(была в архиве)</text>
<line x1="20" y1="372" x2="660" y2="372" stroke="#e2e8f0"/>
<text x="20" y="390" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" textLength="517.4" lengthAdjust="spacingAndGlyphs">Архив есть только у товаров, услуг, категорий, типов оборудования, складов, поставщиков.</text>
<text x="20" y="406" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" textLength="493.9" lengthAdjust="spacingAndGlyphs">Заказы, перемещения, клиенты, оборудование, колонки: только «Действует» и «Удалена».</text>
<text x="20" y="422" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" textLength="476.3" lengthAdjust="spacingAndGlyphs">Терминальных состояний нет: удалённое хранится бессрочно и восстановимо (DS-012).</text>
</svg>