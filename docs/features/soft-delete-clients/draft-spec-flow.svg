<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 788" width="680" height="788" font-family="Helvetica Neue, Arial, sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#475569"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#b91c1c"/></marker></defs>
<rect width="680" height="788" fill="#ffffff"/>
<text x="340" y="24" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="470.4" lengthAdjust="spacingAndGlyphs">Сценарий: удалить клиента с оборудованием и восстановить</text>
<rect x="15" y="40" width="150" height="30" rx="6" fill="#e0f2fe" stroke="#0369a1"/>
<text x="90" y="60" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="87.4" lengthAdjust="spacingAndGlyphs">Администратор</text>
<line x1="90" y1="70" x2="90" y2="748" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<rect x="265" y="40" width="150" height="30" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
<text x="340" y="60" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="67.2" lengthAdjust="spacingAndGlyphs">Экран (§8)</text>
<line x1="340" y1="70" x2="340" y2="748" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<rect x="515" y="40" width="150" height="30" rx="6" fill="#dcfce7" stroke="#15803d"/>
<text x="590" y="60" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="bold" textLength="53.8" lengthAdjust="spacingAndGlyphs">API (§6)</text>
<line x1="590" y1="70" x2="590" y2="748" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<line x1="90" y1="100" x2="340" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="94" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="291.2" lengthAdjust="spacingAndGlyphs">«Удалить» у клиента с оборудованием на складе (§8.1)</text>
<rect x="20" y="110" width="640" height="78" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-dasharray="5 4"/>
<text x="28" y="124" font-size="10" fill="#7f1d1d" text-anchor="start" font-weight="bold" textLength="212.8" lengthAdjust="spacingAndGlyphs">ошибка: оборудование клиента на складе</text>
<line x1="340" y1="146" x2="590" y2="146" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#r)"/>
<text x="465.0" y="140" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="240.8" lengthAdjust="spacingAndGlyphs">DELETE /api/v1/clients/{id} {reason} (§6.1)</text>
<line x1="590" y1="174" x2="340" y2="174" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text x="465.0" y="168" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="184.8" lengthAdjust="spacingAndGlyphs">409 CLIENT_EQUIPMENT_AT_WAREHOUSE</text>
<line x1="90" y1="216" x2="340" y2="216" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="210" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="257.6" lengthAdjust="spacingAndGlyphs">возвращает оборудование клиенту, удаляет снова</text>
<line x1="340" y1="244" x2="590" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="465.0" y="238" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="240.8" lengthAdjust="spacingAndGlyphs">DELETE /api/v1/clients/{id} {reason} (§6.1)</text>
<text x="465.0" y="257" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="normal" textLength="212.8" lengthAdjust="spacingAndGlyphs">клиент и его единицы помечены удалёнными</text>
<line x1="590" y1="284" x2="340" y2="284" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="465.0" y="278" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="218.4" lengthAdjust="spacingAndGlyphs">200 {id, deleted_at, equipment_deleted}</text>
<line x1="340" y1="312" x2="90" y2="312" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="215.0" y="306" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="123.2" lengthAdjust="spacingAndGlyphs">клиент исчез из списка</text>
<line x1="90" y1="340" x2="340" y2="340" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="334" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="168.0" lengthAdjust="spacingAndGlyphs">открывает заказ клиента (§8.3)</text>
<line x1="340" y1="368" x2="590" y2="368" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="465.0" y="362" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="184.8" lengthAdjust="spacingAndGlyphs">GET /api/v1/tasks/128/card (§6.5)</text>
<line x1="590" y1="396" x2="340" y2="396" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="465.0" y="390" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="263.2" lengthAdjust="spacingAndGlyphs">200 … client_is_deleted, equipment[].is_deleted</text>
<line x1="340" y1="424" x2="90" y2="424" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="215.0" y="418" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="190.4" lengthAdjust="spacingAndGlyphs">бейджи «удалён» у клиента и единиц</text>
<line x1="90" y1="462" x2="340" y2="462" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="456" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="196.0" lengthAdjust="spacingAndGlyphs">«Удалённые» → «Оборудование» (§8.2)</text>
<line x1="340" y1="490" x2="590" y2="490" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="465.0" y="484" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="229.6" lengthAdjust="spacingAndGlyphs">GET /api/v1/deleted?kind=equipment (§6.5)</text>
<line x1="590" y1="518" x2="340" y2="518" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="465.0" y="512" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="145.6" lengthAdjust="spacingAndGlyphs">200 … deleted_with: client</text>
<rect x="20" y="528" width="640" height="78" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-dasharray="5 4"/>
<text x="28" y="542" font-size="10" fill="#7f1d1d" text-anchor="start" font-weight="bold" textLength="190.4" lengthAdjust="spacingAndGlyphs">ошибка: единица удалённого клиента</text>
<line x1="340" y1="564" x2="590" y2="564" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#r)"/>
<text x="465.0" y="558" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="235.2" lengthAdjust="spacingAndGlyphs">POST /api/v1/equipment/{id}/restore (§6.4)</text>
<line x1="590" y1="592" x2="340" y2="592" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text x="465.0" y="586" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="100.8" lengthAdjust="spacingAndGlyphs">409 CLIENT_DELETED</text>
<line x1="90" y1="634" x2="340" y2="634" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215.0" y="628" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="190.4" lengthAdjust="spacingAndGlyphs">вкладка «Клиенты» → «Восстановить»</text>
<line x1="340" y1="662" x2="590" y2="662" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<text x="465.0" y="656" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="224.0" lengthAdjust="spacingAndGlyphs">POST /api/v1/clients/{id}/restore (§6.2)</text>
<text x="465.0" y="675" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="normal" textLength="191.5" lengthAdjust="spacingAndGlyphs">клиент и единицы «вместе с клиентом»</text>
<line x1="590" y1="702" x2="340" y2="702" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="465.0" y="696" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="156.8" lengthAdjust="spacingAndGlyphs">200 {id, equipment_restored}</text>
<line x1="340" y1="730" x2="90" y2="730" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="215.0" y="724" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="normal" textLength="257.6" lengthAdjust="spacingAndGlyphs">тост «Восстановлено вместе с оборудованием: 3»</text>
<text x="20" y="776" font-size="10" fill="#334155" text-anchor="start" font-weight="normal" textLength="408.8" lengthAdjust="spacingAndGlyphs">Сплошная стрелка — запрос, пунктир — ответ, красная рамка — ветка ошибки.</text>
</svg>