<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="680" height="440" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#475569"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#b91c1c"/></marker></defs>
<text x="340" y="24" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" textLength="331.1" lengthAdjust="spacingAndGlyphs">Сценарий: накладная клиенту (товар с ценой)</text>
<rect x="10" y="40" width="160" height="30" rx="6" fill="#eff6ff" stroke="#1e3a8a"/>
<text x="90" y="60" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="bold" textLength="72.6" lengthAdjust="spacingAndGlyphs">Исполнитель</text>
<path d="M90,70 L90,415" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="220" y="40" width="160" height="30" rx="6" fill="#f1f5f9" stroke="#334155"/>
<text x="300" y="60" font-size="12" fill="#334155" text-anchor="middle" font-weight="bold" textLength="118.8" lengthAdjust="spacingAndGlyphs">Экран (§8.1, §8.2)</text>
<path d="M300,70 L300,415" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="460" y="40" width="160" height="30" rx="6" fill="#dcfce7" stroke="#14532d"/>
<text x="540" y="60" font-size="12" fill="#14532d" text-anchor="middle" font-weight="bold" textLength="52.8" lengthAdjust="spacingAndGlyphs">API (§6)</text>
<path d="M540,70 L540,415" stroke="#94a3b8" stroke-dasharray="4 4"/>
<path d="M90,100 L300,100" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="195.0" y="94" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="207.9" lengthAdjust="spacingAndGlyphs">«Вернуть клиенту» → «+ Товар» → цена</text>
<path d="M300,126 L90,126" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="195.0" y="120" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="225.2" lengthAdjust="spacingAndGlyphs">«Сумма накладной» пересчитана на экране</text>
<path d="M90,152 L300,152" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="195.0" y="146" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="63.5" lengthAdjust="spacingAndGlyphs">«Отправить»</text>
<path d="M300,178 L540,178" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="420.0" y="172" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="311.9" lengthAdjust="spacingAndGlyphs">POST /api/v1/transfers {…, items:[{price}], send:true}</text>
<path d="M540,204 L300,204" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="420.0" y="198" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="248.3" lengthAdjust="spacingAndGlyphs">201 {status:"in_transit", amount, warnings}</text>
<path d="M300,230 L90,230" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="195.0" y="224" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="277.2" lengthAdjust="spacingAndGlyphs">товар списан; жёлтый блок, если остаток в минусе</text>
<path d="M90,256 L300,256" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="195.0" y="250" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="144.4" lengthAdjust="spacingAndGlyphs">открывает карточку заказа</text>
<path d="M300,282 L540,282" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="420.0" y="276" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="144.4" lengthAdjust="spacingAndGlyphs">GET /api/v1/tasks/37/card</text>
<path d="M540,308 L300,308" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="420.0" y="302" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="248.3" lengthAdjust="spacingAndGlyphs">200 {task:{total_amount, transfers_amount}}</text>
<path d="M300,334 L90,334" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="195.0" y="328" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="225.2" lengthAdjust="spacingAndGlyphs">«Продано по накладным», «Итого» выросли</text>
<path d="M300,360 L540,360" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#r)"/>
<text x="420.0" y="354" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="normal" textLength="265.7" lengthAdjust="spacingAndGlyphs">PUT /api/v1/transfers/14 (цена после отправки)</text>
<path d="M540,386 L300,386" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#r)" stroke-dasharray="5 4"/>
<text x="420.0" y="380" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="normal" textLength="161.7" lengthAdjust="spacingAndGlyphs">409 TRANSFER_STATUS_CONFLICT</text>
<text x="340" y="430" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" textLength="407.0" lengthAdjust="spacingAndGlyphs">Сплошная стрелка — запрос/действие, пунктир — ответ; красным — error-ветка</text>
</svg>