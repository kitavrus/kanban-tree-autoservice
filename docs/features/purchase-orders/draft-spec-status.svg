<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica Neue, Arial, sans-serif">
<title>Статусная модель заказа поставщику</title>
<desc>draft → sent по кнопке Отправить, sent → draft по Отозвать, sent → ready по кнопке поставщика Собрано, ready → picked_up по Забрали. Базар: draft → picked_up. Поставщик без активного входа: sent → picked_up. Отмена с причиной из draft, sent, ready в cancelled. picked_up и cancelled терминальные.</desc>
<rect x="0" y="0" width="680" height="600" fill="#ffffff"/>
<circle cx="250" cy="18" r="6" fill="#5F5E5A"/>
<line x1="250" y1="24" x2="250" y2="44" stroke="#5F5E5A" stroke-width="1.5"/><polygon points="250,52 245,43 255,43" fill="#5F5E5A"/>
<text x="262" y="42" font-size="12" fill="#444441" textLength="253" lengthAdjust="spacingAndGlyphs">«Сохранить черновик» (admin / executor)</text>
<rect x="130" y="52" width="240" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="250" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A" textLength="38" lengthAdjust="spacingAndGlyphs">draft</text>
<text x="250" y="91" text-anchor="middle" font-size="11" fill="#5F5E5A" textLength="190" lengthAdjust="spacingAndGlyphs">можно: правка строк и примечания</text>
<text x="250" y="105" text-anchor="middle" font-size="11" fill="#5F5E5A" textLength="226" lengthAdjust="spacingAndGlyphs">отправить · отменить · удалить (admin)</text>
<text x="250" y="119" text-anchor="middle" font-size="11" fill="#5F5E5A" textLength="95" lengthAdjust="spacingAndGlyphs">Базар: «Забрали»</text>
<rect x="130" y="188" width="240" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="250" y="210" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53" textLength="30" lengthAdjust="spacingAndGlyphs">sent</text>
<text x="250" y="227" text-anchor="middle" font-size="11" fill="#185FA5" textLength="208" lengthAdjust="spacingAndGlyphs">можно: правка (сброс ответа строки)</text>
<text x="250" y="241" text-anchor="middle" font-size="11" fill="#185FA5" textLength="226" lengthAdjust="spacingAndGlyphs">ответ поставщика · отозвать · отменить</text>
<text x="250" y="255" text-anchor="middle" font-size="11" fill="#185FA5" textLength="232" lengthAdjust="spacingAndGlyphs">«Забрали» — если у поставщика нет входа</text>
<rect x="130" y="324" width="240" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="250" y="346" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C" textLength="38" lengthAdjust="spacingAndGlyphs">ready</text>
<text x="250" y="363" text-anchor="middle" font-size="11" fill="#0F6E56" textLength="214" lengthAdjust="spacingAndGlyphs">можно: «Забрали» · отменить · печать</text>
<text x="250" y="377" text-anchor="middle" font-size="11" fill="#0F6E56" textLength="143" lengthAdjust="spacingAndGlyphs">строки только для чтения</text>
<rect x="130" y="450" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<rect x="134" y="454" width="232" height="48" rx="6" fill="none" stroke="#534AB7" stroke-width="1.2"/>
<text x="250" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C" textLength="68" lengthAdjust="spacingAndGlyphs">picked_up</text>
<text x="250" y="489" text-anchor="middle" font-size="11" fill="#534AB7" textLength="214" lengthAdjust="spacingAndGlyphs">терминальный: только чтение и печать</text>
<rect x="460" y="324" width="200" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
<rect x="464" y="328" width="192" height="48" rx="6" fill="none" stroke="#A32D2D" stroke-width="1.2"/>
<text x="560" y="346" text-anchor="middle" font-size="14" font-weight="600" fill="#501313" textLength="68" lengthAdjust="spacingAndGlyphs">cancelled</text>
<text x="560" y="363" text-anchor="middle" font-size="11" fill="#A32D2D" textLength="172" lengthAdjust="spacingAndGlyphs">терминальный: только мы видим</text>
<line x1="290" y1="128" x2="290" y2="180" stroke="#5F5E5A" stroke-width="1.5"/><polygon points="290,188 285,179 295,179" fill="#5F5E5A"/>
<text x="298" y="162" font-size="11" fill="#444441" textLength="232" lengthAdjust="spacingAndGlyphs">«Отправить» (есть поставщик, ≥1 строка)</text>
<line x1="210" y1="188" x2="210" y2="136" stroke="#5F5E5A" stroke-width="1.5"/><polygon points="210,128 205,137 215,137" fill="#5F5E5A"/>
<text x="202" y="162" text-anchor="end" font-size="11" fill="#444441" textLength="59" lengthAdjust="spacingAndGlyphs">«Отозвать»</text>
<line x1="290" y1="264" x2="290" y2="316" stroke="#5F5E5A" stroke-width="1.5"/><polygon points="290,324 285,315 295,315" fill="#5F5E5A"/>
<text x="298" y="298" font-size="11" fill="#444441" textLength="249" lengthAdjust="spacingAndGlyphs">«Собрано» (поставщик; все строки отвечены)</text>
<line x1="250" y1="386" x2="250" y2="442" stroke="#5F5E5A" stroke-width="1.5"/><polygon points="250,450 245,441 255,441" fill="#5F5E5A"/>
<text x="258" y="422" font-size="11" fill="#444441" textLength="184" lengthAdjust="spacingAndGlyphs">«Забрали» (остатки не меняются)</text>
<polyline points="130,100 60,100 60,486 122,486" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<polygon points="130,486 121,481 121,491" fill="#5F5E5A"/>
<text x="52" y="380" font-size="11" fill="#444441" transform="rotate(-90 52 380)" textLength="148" lengthAdjust="spacingAndGlyphs">Базар: «Забрали» из draft</text>
<polyline points="130,236 100,236 100,470 122,470" fill="none" stroke="#185FA5" stroke-width="1.5"/>
<polygon points="130,470 121,465 121,475" fill="#185FA5"/>
<text x="94" y="440" font-size="11" fill="#185FA5" transform="rotate(-90 94 440)" textLength="202" lengthAdjust="spacingAndGlyphs">«Забрали» — у поставщика нет входа</text>
<polyline points="370,80 600,80 600,324" fill="none" stroke="#A32D2D" stroke-width="1.5"/>
<polygon points="600,324 595,315 605,315" fill="#A32D2D"/>
<polyline points="370,226 540,226 540,324" fill="none" stroke="#A32D2D" stroke-width="1.5"/>
<polygon points="540,324 535,315 545,315" fill="#A32D2D"/>
<line x1="370" y1="352" x2="452" y2="352" stroke="#A32D2D" stroke-width="1.5"/><polygon points="460,352 451,347 451,357" fill="#A32D2D"/>
<text x="380" y="74" font-size="11" fill="#A32D2D" textLength="154" lengthAdjust="spacingAndGlyphs">«Отменить» + причина 1–500</text>
<text x="380" y="220" font-size="11" fill="#A32D2D" textLength="119" lengthAdjust="spacingAndGlyphs">«Отменить» + причина</text>
<text x="380" y="346" font-size="11" fill="#A32D2D" textLength="59" lengthAdjust="spacingAndGlyphs">«Отменить»</text>
<line x1="20" y1="530" x2="660" y2="530" stroke="#D3D1C7" stroke-width="1"/>
<text x="20" y="550" font-size="11" fill="#444441" textLength="576" lengthAdjust="spacingAndGlyphs">Двойная рамка — терминальный статус. Действие, не указанное в «можно», → 409 (+ негативный тест).</text>
<text x="20" y="568" font-size="11" fill="#444441" textLength="582" lengthAdjust="spacingAndGlyphs">Все переходы — с f:version заказа (устаревшая → 409). «Забрали» не меняет products.stock (DS-010).</text>
<text x="20" y="586" font-size="11" fill="#444441" textLength="588" lengthAdjust="spacingAndGlyphs">Кнопки нашей стороны — admin и executor (executor — только свои заказы); «Собрано» — роль supplier.</text>
</svg>