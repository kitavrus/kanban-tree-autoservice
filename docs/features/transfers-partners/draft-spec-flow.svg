<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="680" height="500" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#475569"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#b91c1c"/></marker></defs>
<text x="340" y="24" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" textLength="446.6" lengthAdjust="spacingAndGlyphs">Сценарий: приём в ремонт и возврат клиенту (по заказу #37)</text>
<rect x="10" y="40" width="160" height="30" rx="6" fill="#eff6ff" stroke="#1e3a8a"/>
<text x="90" y="60" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="bold" textLength="72.6" lengthAdjust="spacingAndGlyphs">Исполнитель</text>
<path d="M90,70 L90,475" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="220" y="40" width="160" height="30" rx="6" fill="#f1f5f9" stroke="#334155"/>
<text x="300" y="60" font-size="12" fill="#334155" text-anchor="middle" font-weight="bold" textLength="125.4" lengthAdjust="spacingAndGlyphs">Экран (§8.2 → §8.1)</text>
<path d="M300,70 L300,475" stroke="#94a3b8" stroke-dasharray="4 4"/>
<rect x="460" y="40" width="160" height="30" rx="6" fill="#dcfce7" stroke="#14532d"/>
<text x="540" y="60" font-size="12" fill="#14532d" text-anchor="middle" font-weight="bold" textLength="52.8" lengthAdjust="spacingAndGlyphs">API (§6)</text>
<path d="M540,70 L540,475" stroke="#94a3b8" stroke-dasharray="4 4"/>
<path d="M90,100 L300,100" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="195.0" y="94" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="219.5" lengthAdjust="spacingAndGlyphs">«Принять от клиента» (карточка заказа)</text>
<path d="M300,125 L540,125" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="420.0" y="119" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="144.4" lengthAdjust="spacingAndGlyphs">GET /api/v1/tasks/37/card</text>
<path d="M540,150 L300,150" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="420.0" y="144" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="184.8" lengthAdjust="spacingAndGlyphs">200 {task, equipment, transfers}</text>
<path d="M90,175 L300,175" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="195.0" y="169" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="132.8" lengthAdjust="spacingAndGlyphs">склад → «Принять сразу»</text>
<path d="M300,200 L540,200" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="420.0" y="194" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="335.0" lengthAdjust="spacingAndGlyphs">POST /api/v1/transfers {client_to_warehouse, receive:true}</text>
<path d="M540,225 L300,225" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="420.0" y="219" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="173.2" lengthAdjust="spacingAndGlyphs">201 {id:12, status:"received"}</text>
<path d="M300,250 L90,250" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="195.0" y="244" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="155.9" lengthAdjust="spacingAndGlyphs">единица: «на складе Алматы»</text>
<path d="M90,275 L300,275" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="195.0" y="269" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="283.0" lengthAdjust="spacingAndGlyphs">ремонт выполнен → «Вернуть клиенту» → «Отправить»</text>
<path d="M300,300 L540,300" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="420.0" y="294" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="317.6" lengthAdjust="spacingAndGlyphs">POST /api/v1/transfers {warehouse_to_client, send:true}</text>
<path d="M540,325 L300,325" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="420.0" y="319" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="184.8" lengthAdjust="spacingAndGlyphs">201 {id:14, status:"in_transit"}</text>
<path d="M90,350 L300,350" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="195.0" y="344" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="150.2" lengthAdjust="spacingAndGlyphs">клиент получил → «Принять»</text>
<path d="M300,375 L540,375" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="420.0" y="369" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="248.3" lengthAdjust="spacingAndGlyphs">POST /api/v1/transfers/14/receive {version}</text>
<path d="M540,400 L300,400" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="420.0" y="394" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="normal" textLength="213.7" lengthAdjust="spacingAndGlyphs">200 {status:"received"} → «у клиента»</text>
<path d="M300,425 L540,425" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#r)"/>
<text x="420.0" y="419" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="normal" textLength="259.9" lengthAdjust="spacingAndGlyphs">POST /api/v1/transfers (единица не из заказа)</text>
<path d="M540,450 L300,450" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#r)" stroke-dasharray="5 4"/>
<text x="420.0" y="444" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="normal" textLength="219.5" lengthAdjust="spacingAndGlyphs">400 items[0].equipment_id: not_in_task</text>
<text x="340" y="490" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" textLength="407.0" lengthAdjust="spacingAndGlyphs">Сплошная стрелка — запрос/действие, пунктир — ответ; красным — error-ветка</text>
</svg>