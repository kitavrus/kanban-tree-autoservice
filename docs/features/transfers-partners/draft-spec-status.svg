<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="680" height="520" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#475569"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#b91c1c"/></marker></defs>
<text x="340" y="26" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" textLength="431.2" lengthAdjust="spacingAndGlyphs">Статусная модель документа (часть 4: четыре направления)</text>
<circle cx="60" cy="110" r="8" fill="#334155"/>
<rect x="130" y="70" width="180" height="80" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="220.0" y="94" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold" textLength="128.7" lengthAdjust="spacingAndGlyphs">requested · Заявка</text>
<text x="220.0" y="114" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="normal" textLength="90.8" lengthAdjust="spacingAndGlyphs">можно: править,</text>
<text x="220.0" y="129" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="normal" textLength="115.0" lengthAdjust="spacingAndGlyphs">отправить, отменить</text>
<rect x="440" y="70" width="190" height="80" rx="8" fill="#fef9c3" stroke="#713f12" stroke-width="1.5"/>
<text x="535.0" y="94" font-size="13" fill="#713f12" text-anchor="middle" font-weight="bold" textLength="135.9" lengthAdjust="spacingAndGlyphs">in_transit · В пути</text>
<text x="535.0" y="114" font-size="11" fill="#713f12" text-anchor="middle" font-weight="normal" textLength="90.8" lengthAdjust="spacingAndGlyphs">можно: принять,</text>
<text x="535.0" y="129" font-size="11" fill="#713f12" text-anchor="middle" font-weight="normal" textLength="48.4" lengthAdjust="spacingAndGlyphs">отменить</text>
<rect x="440" y="270" width="190" height="80" rx="8" fill="#dcfce7" stroke="#14532d" stroke-width="1.5"/>
<rect x="444" y="274" width="182" height="72" rx="6" fill="none" stroke="#14532d" stroke-width="1"/>
<text x="535.0" y="294" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold" textLength="135.9" lengthAdjust="spacingAndGlyphs">received · Получено</text>
<text x="535.0" y="314" font-size="11" fill="#14532d" text-anchor="middle" font-weight="normal" textLength="72.6" lengthAdjust="spacingAndGlyphs">терминальный</text>
<text x="535.0" y="329" font-size="11" fill="#14532d" text-anchor="middle" font-weight="normal" textLength="102.9" lengthAdjust="spacingAndGlyphs">(откат — часть 6)</text>
<rect x="130" y="270" width="180" height="80" rx="8" fill="#fee2e2" stroke="#7f1d1d" stroke-width="1.5"/>
<rect x="134" y="274" width="172" height="72" rx="6" fill="none" stroke="#7f1d1d" stroke-width="1"/>
<text x="220.0" y="294" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="bold" textLength="135.9" lengthAdjust="spacingAndGlyphs">cancelled · Отменён</text>
<text x="220.0" y="314" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="72.6" lengthAdjust="spacingAndGlyphs">терминальный</text>
<path d="M68,110 L128,110" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="98" y="100" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="42.4" lengthAdjust="spacingAndGlyphs">создать</text>
<path d="M310,110 L438,110" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="374" y="100" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="108.9" lengthAdjust="spacingAndGlyphs">send · «Отправить»</text>
<path d="M535,150 L535,268" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="590" y="205" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="54.5" lengthAdjust="spacingAndGlyphs">receive ·</text>
<text x="590" y="220" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="54.5" lengthAdjust="spacingAndGlyphs">«Принять»</text>
<path d="M220,150 L220,268" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="178" y="205" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="48.4" lengthAdjust="spacingAndGlyphs">cancel ·</text>
<text x="178" y="220" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="60.5" lengthAdjust="spacingAndGlyphs">«Отменить»</text>
<path d="M440,145 L312,275" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="360" y="190" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="108.9" lengthAdjust="spacingAndGlyphs">cancel · «Отменить</text>
<text x="360" y="205" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="54.5" lengthAdjust="spacingAndGlyphs">отправку»</text>
<text x="374" y="62" font-size="10" fill="#475569" text-anchor="middle" font-weight="normal" textLength="357.5" lengthAdjust="spacingAndGlyphs">«Принять сразу»: создать → отправить → принять (приём от клиента)</text>
<rect x="30" y="375" width="620" height="130" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="396" font-size="12" fill="#1f2937" text-anchor="start" font-weight="bold" textLength="264.0" lengthAdjust="spacingAndGlyphs">Легенда — что происходит по направлениям</text>
<text x="44" y="414" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" textLength="589.1" lengthAdjust="spacingAndGlyphs">Клиент → склад: send — единица «в пути» от клиента; receive — «на складе»; cancel — снова «у клиента».</text>
<text x="44" y="430" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" textLength="537.1" lengthAdjust="spacingAndGlyphs">Склад → клиент: send — единица «в пути → клиент»; receive (жмёт наш сотрудник) — «у клиента».</text>
<text x="44" y="446" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" textLength="554.4" lengthAdjust="spacingAndGlyphs">Поставщик → склад: send — движений нет; receive — остаток +факт (факт может быть больше заказа).</text>
<text x="44" y="462" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" textLength="566.0" lengthAdjust="spacingAndGlyphs">Склад → склад: как в ядре. Кто: admin — все; executor — только документы с клиентом (чужие → 404).</text>
<text x="44" y="478" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" textLength="519.8" lengthAdjust="spacingAndGlyphs">Недопустимое действие → 409 TRANSFER_STATUS_CONFLICT. Двойная рамка — терминальный статус.</text>
</svg>