<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="680" height="520" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#475569"/></marker><marker id="n" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#b45309"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#b91c1c"/></marker></defs>
<text x="340" y="26" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" textLength="415.8" lengthAdjust="spacingAndGlyphs">Статусная модель документа (часть 6: откат и удаление)</text>
<circle cx="60" cy="110" r="8" fill="#334155"/>
<rect x="130" y="70" width="180" height="80" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="220.0" y="94" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold" textLength="128.7" lengthAdjust="spacingAndGlyphs">requested · Заявка</text>
<text x="220.0" y="114" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="normal" textLength="157.3" lengthAdjust="spacingAndGlyphs">можно: править, отправить,</text>
<text x="220.0" y="129" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="normal" textLength="151.2" lengthAdjust="spacingAndGlyphs">отменить, удалить (admin)</text>
<rect x="440" y="70" width="190" height="80" rx="8" fill="#fef9c3" stroke="#713f12" stroke-width="1.5"/>
<text x="535.0" y="94" font-size="13" fill="#713f12" text-anchor="middle" font-weight="bold" textLength="135.9" lengthAdjust="spacingAndGlyphs">in_transit · В пути</text>
<text x="535.0" y="114" font-size="11" fill="#713f12" text-anchor="middle" font-weight="normal" textLength="90.8" lengthAdjust="spacingAndGlyphs">можно: принять,</text>
<text x="535.0" y="129" font-size="11" fill="#713f12" text-anchor="middle" font-weight="normal" textLength="48.4" lengthAdjust="spacingAndGlyphs">отменить</text>
<rect x="440" y="270" width="190" height="80" rx="8" fill="#dcfce7" stroke="#14532d" stroke-width="1.5"/>
<text x="535.0" y="294" font-size="13" fill="#14532d" text-anchor="middle" font-weight="bold" textLength="135.9" lengthAdjust="spacingAndGlyphs">received · Получено</text>
<text x="535.0" y="314" font-size="11" fill="#14532d" text-anchor="middle" font-weight="normal" textLength="90.8" lengthAdjust="spacingAndGlyphs">можно: отменить</text>
<text x="535.0" y="329" font-size="11" fill="#14532d" text-anchor="middle" font-weight="normal" textLength="108.9" lengthAdjust="spacingAndGlyphs">проведение (admin)</text>
<rect x="130" y="270" width="180" height="80" rx="8" fill="#fee2e2" stroke="#7f1d1d" stroke-width="1.5"/>
<rect x="134" y="274" width="172" height="72" rx="6" fill="none" stroke="#7f1d1d" stroke-width="1"/>
<text x="220.0" y="294" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="bold" textLength="135.9" lengthAdjust="spacingAndGlyphs">cancelled · Отменён</text>
<text x="220.0" y="314" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="72.6" lengthAdjust="spacingAndGlyphs">терминальный</text>
<text x="220.0" y="329" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="normal" textLength="133.1" lengthAdjust="spacingAndGlyphs">можно: удалить (admin)</text>
<path d="M68,110 L128,110" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="98" y="100" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="42.4" lengthAdjust="spacingAndGlyphs">создать</text>
<path d="M310,110 L438,110" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="374" y="100" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="24.2" lengthAdjust="spacingAndGlyphs">send</text>
<path d="M505,150 L505,268" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="472" y="212" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="42.4" lengthAdjust="spacingAndGlyphs">receive</text>
<path d="M575,268 L575,152" stroke="#b45309" stroke-width="2.2" fill="none" marker-end="url(#n)"/>
<text x="625" y="198" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold" textLength="54.5" lengthAdjust="spacingAndGlyphs">unreceive</text>
<text x="625" y="213" font-size="11" fill="#b45309" text-anchor="middle" font-weight="normal" textLength="36.3" lengthAdjust="spacingAndGlyphs">admin,</text>
<text x="625" y="228" font-size="11" fill="#b45309" text-anchor="middle" font-weight="normal" textLength="42.4" lengthAdjust="spacingAndGlyphs">причина</text>
<path d="M220,150 L220,268" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="190" y="212" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="36.3" lengthAdjust="spacingAndGlyphs">cancel</text>
<path d="M440,145 L312,275" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="352" y="200" font-size="11" fill="#475569" text-anchor="middle" font-weight="normal" textLength="36.3" lengthAdjust="spacingAndGlyphs">cancel</text>
<path d="M130,95 L60,60" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#r)"/>
<text x="62" y="48" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold" textLength="36.3" lengthAdjust="spacingAndGlyphs">delete</text>
<path d="M130,330 L60,365" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#r)"/>
<text x="62" y="382" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold" textLength="36.3" lengthAdjust="spacingAndGlyphs">delete</text>
<rect x="30" y="400" width="620" height="105" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="44" y="420" font-size="12" fill="#1f2937" text-anchor="start" font-weight="bold" textLength="46.2" lengthAdjust="spacingAndGlyphs">Легенда</text>
<text x="44" y="438" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" textLength="560.2" lengthAdjust="spacingAndGlyphs">Новое в части 6: unreceive (оранжевая стрелка) и delete (красные стрелки). Остальное — части 3–5.</text>
<text x="44" y="454" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" textLength="635.2" lengthAdjust="spacingAndGlyphs">unreceive: остаток −факт (может уйти в минус, warnings), единицы снова «в пути», факт и «кто принял» обнулены.</text>
<text x="44" y="470" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" textLength="612.2" lengthAdjust="spacingAndGlyphs">unreceive запрещён (409 TRANSFER_UNRECEIVE_BLOCKED), если единицу увёз более поздний документ — он назван.</text>
<text x="44" y="486" font-size="10.5" fill="#334155" text-anchor="start" font-weight="normal" textLength="606.4" lengthAdjust="spacingAndGlyphs">delete: только Заявка и Отменён. Заказ с Заявкой / В пути / Получено не удалить (409 TASK_HAS_TRANSFERS).</text>
</svg>