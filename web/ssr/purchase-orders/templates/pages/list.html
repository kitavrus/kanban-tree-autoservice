{{ define "actions" }}<a href="/purchases/new" class="btn btn-primary ms-auto" data-testid="po-new">Новый заказ</a>{{ end }}

{{ define "content" }}
<!-- §8.1 «Закупки»: список рисует /assets/ssr-shared/js/purchases.js поверх GET /api/v1/purchase-orders. -->
<div id="po-list" data-po-page="list" data-testid="po-list-root">
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
    <label for="po-status" class="visually-hidden">Статус</label>
    <select id="po-status" class="form-select" style="max-width:240px" data-native data-testid="po-filter-status">
      <option value="">Все</option>
      {{ range .Statuses }}<option value="{{ .Value }}">{{ .Title }}</option>
      {{ end }}
    </select>
  </div>
  <div class="table-responsive d-none" id="po-table-wrap">
    <table class="table table-hover align-middle" data-testid="po-table">
      <thead><tr><th>Номер</th><th>Получатель</th><th>Статус</th><th class="text-end">Строк</th><th class="text-end">Сумма</th><th>Создан</th><th>Отправлен</th><th>Забрали</th></tr></thead>
      <tbody id="po-tbody"></tbody>
    </table>
  </div>
  <div class="empty-state d-none" id="po-empty" data-testid="po-empty">
    <div class="mb-3">Закупок пока нет</div>
    <a href="/purchases/new" class="btn btn-primary">Новый заказ</a>
  </div>
  <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
    <span class="text-body-secondary small" id="po-total" data-testid="po-total"></span>
    <div class="ms-auto d-flex gap-2" id="po-pager">
      <button type="button" class="btn btn-sm btn-outline-secondary d-none" id="po-prev" data-testid="po-prev">← Назад</button>
      <button type="button" class="btn btn-sm btn-outline-secondary d-none" id="po-next" data-testid="po-next">Вперёд →</button>
    </div>
  </div>
</div>
{{ end }}

{{ define "scripts" }}<script src="/assets/ssr-shared/js/purchases.js"></script>{{ end }}
