{{ define "actions" }}
<button type="button" class="btn btn-primary btn-sm" id="task-add-btn" data-testid="task-add">+ Заказ</button>
{{ if .IsAdmin }}
<button type="button" class="btn btn-outline-secondary btn-sm" id="column-add-btn" data-testid="column-add">+ Колонка</button>
{{ end }}
{{ end }}

{{ define "content" }}
<div class="board-filters d-flex flex-wrap gap-2 align-items-center mb-3" data-testid="board-filters">
  <select class="form-select form-select-sm" id="filter-client" data-testid="filter-client" style="max-width:220px">
    <option value="">Все клиенты</option>
  </select>
  <input type="search" class="form-control form-control-sm" id="filter-q" data-testid="filter-q"
         placeholder="Поиск: №, заказ, клиент, госномер, услуга, товар, модель/SN" style="max-width:300px" autocomplete="off">
  <select class="form-select form-select-sm" id="filter-category" data-testid="filter-category" style="max-width:200px">
    <option value="">Все виды работ</option>
  </select>
  <select class="form-select form-select-sm" id="filter-paid" data-testid="filter-paid" style="max-width:160px">
    <option value="all">Оплата: все</option>
    <option value="paid">Оплачен</option>
    <option value="unpaid">Не оплачен</option>
  </select>
  <select class="form-select form-select-sm" id="filter-executor-paid" data-testid="filter-executor-paid" style="max-width:230px"
          aria-label="Выплата исполнителю">
    <option value="all">Выплата исполнителю: все</option>
    <option value="paid">Исполнителю выплачено</option>
    <option value="unpaid">Исполнителю не выплачено</option>
  </select>
  <select class="form-select form-select-sm" id="filter-assignee" data-testid="filter-assignee" style="max-width:200px">
    <option value="all">Все исполнители</option>
    <option value="me">Мои</option>
  </select>
  <select class="form-select form-select-sm" id="filter-due" data-testid="filter-due" style="max-width:180px">
    <option value="all">Любой срок</option>
    <option value="soon">Горит (сегодня/завтра, просрочено)</option>
    <option value="overdue">Только просроченные</option>
  </select>
  <button type="button" class="btn btn-outline-secondary btn-sm" id="filter-reset" data-testid="filter-reset">Сбросить</button>
  <span class="text-body-secondary small ms-auto" id="board-total" data-testid="board-total"></span>{{/* pagination DS-004 */}}
</div>

<div id="board" class="board-columns" data-testid="board-root"
     data-viewer-id="{{ .ViewerID }}" data-is-admin="{{ .IsAdmin }}">
  <div class="empty-state" data-testid="board-loading">Загрузка доски…</div>
</div>

{{ template "task-modal" . }}

<!-- Модалка колонки (admin, SD-005) -->
<div class="modal fade" id="column-modal" tabindex="-1" aria-hidden="true" data-testid="column-form">
  <div class="modal-dialog">
    <form class="modal-content" id="column-form-el" novalidate>
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="column-modal-title">Новая колонка</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-danger d-none" id="column-error" data-testid="column-error"></div>
        <div class="mb-3">
          <label class="form-label" for="column-name">Название *</label>
          <input class="form-control" id="column-name" data-testid="column-name" maxlength="60" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="column-color">Цвет *</label>
          <input class="form-control" id="column-color" data-testid="column-color" pattern="^#[0-9A-Fa-f]{6}$" required placeholder="#RRGGBB">
          <div class="swatches d-flex gap-2 mt-2" id="column-swatches" data-testid="column-swatches"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="column-position">Позиция</label>
          <input type="number" min="1" step="1" class="form-control" id="column-position" data-testid="column-position">
        </div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="column-final" data-testid="column-final">
          <label class="form-check-label" for="column-final">Финальная колонка — заказы считаются выполненными</label>
        </div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="column-consumes" data-testid="column-consumes">
          <label class="form-check-label" for="column-consumes">Списывать товары со склада</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-danger me-auto d-none" id="column-delete-btn" data-testid="column-delete">Удалить</button>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="submit" class="btn btn-primary" id="column-save-btn" data-testid="column-save">Сохранить</button>
      </div>
    </form>
  </div>
</div>
{{ end }}

{{ define "scripts" }}
<script src="/assets/ssr-shared/js/task-card.js"></script>
<script src="/assets/ssr-shared/js/board.js"></script>
{{ end }}
