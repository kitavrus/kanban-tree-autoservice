{{ define "content" }}
<form class="card mw-760" method="post" action="{{ if .IsNew }}/clients/{{ .ClientID }}/equipment{{ else }}/equipment/{{ .ID }}{{ end }}" data-testid="equipment-form" data-once novalidate>
  <div class="card-body">
    <input type="hidden" name="_csrf" value="{{ .Shell.CSRFToken }}">
    <p class="text-body-secondary small" data-testid="equipment-client-name">{{ .ClientName }}</p>
    {{ if .Error }}<div class="alert alert-danger py-2" role="alert" data-testid="form-error">{{ .Error }}</div>{{ end }}
    <div class="mb-3">
      <label for="plate_number" class="form-label">Госномер *</label>
      <input id="plate_number" name="plate_number" class="form-control text-uppercase mw-260{{ if index .Errors "plate_number" }} is-invalid{{ end }}" value="{{ .PlateNumber }}" maxlength="20" autocomplete="off" placeholder="А123ВС 777" data-testid="equipment-plate-number">
      {{ with index .Errors "plate_number" }}<div class="invalid-feedback" data-testid="error-plate_number">{{ . }}</div>{{ end }}
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" data-testid="equipment-save">Сохранить</button>
      <a href="/clients/{{ .ClientID }}" class="btn btn-outline-secondary">Отмена</a>
      {{ if not .IsNew }}<a href="/equipment/{{ .ID }}/history" class="btn btn-outline-primary ms-auto" data-testid="equipment-form-history">История</a>{{ end }}
    </div>
  </div>
</form>
{{ if not .IsNew }}
<form method="post" action="/equipment/{{ .ID }}/delete" class="mt-3" data-testid="equipment-delete-form" data-delete-dialog
      data-delete-title="Удалить «{{ .PlateNumber }}»?"
      data-delete-text="Единицу можно восстановить в разделе «Удалённые»"
      {{ if .DeleteError }}data-delete-error="{{ .DeleteError }}"{{ end }}>
  <input type="hidden" name="_csrf" value="{{ .Shell.CSRFToken }}">
  <input type="hidden" name="reason" value="{{ .DeleteReason }}">
  <button type="submit" class="btn btn-link text-danger p-0" data-testid="equipment-delete">Удалить</button>
</form>
{{ end }}
{{ end }}
